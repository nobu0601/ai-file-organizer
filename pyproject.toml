[project]
name = "ai-file-organizer"
version = "0.1.0"
description = "AI 自律型 Windows ファイル整理アプリ（ローカル LLM 対応）"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
